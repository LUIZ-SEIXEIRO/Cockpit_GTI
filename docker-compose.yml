name: cockpit-gti

services:
  ollama:
    image: ollama/ollama:latest
    container_name: cockpit-gti-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - H:/spaguas/ia-multiagente/ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  new-api:
    image: calciumion/new-api:latest
    container_name: cockpit-gti-newapi
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - new-api-data:/data
    depends_on:
      - ollama

  cockpit-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: cockpit-gti-cockpit-backend:main
    container_name: cockpit-gti-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - ./data:/app/data
      - ./main.py:/app/main.py
      - ./painel.html:/app/painel.html
      - ./config_pool_ias.json:/app/config_pool_ias.json
      - ./docs:/app/docs
      - ./README.md:/app/README.md
    environment:
      - COCKPIT_API_TOKEN=${COCKPIT_API_TOKEN:-${API_TOKEN:-}}
      - API_TOKEN=${API_TOKEN:-${COCKPIT_API_TOKEN:-}}
      - VERIFY_SSL=${VERIFY_SSL:-true}
      - OPENPROJECT_URL=${OPENPROJECT_URL:-https://openproject.spaguas.sp.gov.br}
      - OPENPROJECT_API_TOKEN=${OPENPROJECT_API_TOKEN:-${OPENPROJECT_API_KEY:-}}
      - OPENPROJECT_API_KEY=${OPENPROJECT_API_KEY:-${OPENPROJECT_API_TOKEN:-}}
      - GLPI_URL=${GLPI_URL:-https://glpi.spaguas.sp.gov.br}
      - GLPI_APP_TOKEN=${GLPI_APP_TOKEN:-}
      - GLPI_USER_TOKEN=${GLPI_USER_TOKEN:-}
      - NEW_API_KEY=${NEW_API_KEY:-}
      - NEWAPI_API_KEY=${NEWAPI_API_KEY:-${NEW_API_KEY:-}}
      - IA_DEFAULT_ENDPOINT=${IA_DEFAULT_ENDPOINT:-}
      - IA_ALLOWED_ENDPOINTS=${IA_ALLOWED_ENDPOINTS:-}
    depends_on:
      new-api:
        condition: service_started
      ollama:
        condition: service_healthy

volumes:
  new-api-data:
    external: true
