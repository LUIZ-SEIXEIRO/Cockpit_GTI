name: cockpit-gti

services:
  ollama:
    image: ollama/ollama:latest
    container_name: cockpit-gti-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - H:/spaguas/ia-multiagente/ollama_data:/root/.ollama
    environment:
      - API_TOKEN=${API_TOKEN:-}
      - VERIFY_SSL=${VERIFY_SSL:-true}
      - OPENPROJECT_URL=${OPENPROJECT_URL:-}
      - OPENPROJECT_API_KEY=${OPENPROJECT_API_KEY:-}
      - GLPI_URL=${GLPI_URL:-}
      - GLPI_APP_TOKEN=${GLPI_APP_TOKEN:-}
      - GLPI_USER_TOKEN=${GLPI_USER_TOKEN:-}
      - NEW_API_KEY=${NEW_API_KEY:-}

  new-api:
    image: calciumion/new-api:latest
    container_name: cockpit-gti-newapi
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - new-api-data:/data
    depends_on:
      - ollama

  cockpit-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: cockpit-gti-cockpit-backend:main
    container_name: cockpit-gti-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./main.py:/app/main.py
      - ./painel.html:/app/painel.html
      - ./config_pool_ias.json:/app/config_pool_ias.json
      - ./docs:/app/docs
      - ./README.md:/app/README.md
    environment:
      - API_TOKEN=${API_TOKEN:-}
      - VERIFY_SSL=${VERIFY_SSL:-true}
      - OPENPROJECT_URL=${OPENPROJECT_URL:-}
      - OPENPROJECT_API_KEY=${OPENPROJECT_API_KEY:-}
      - GLPI_URL=${GLPI_URL:-}
      - GLPI_APP_TOKEN=${GLPI_APP_TOKEN:-}
      - GLPI_USER_TOKEN=${GLPI_USER_TOKEN:-}
      - NEW_API_KEY=${NEW_API_KEY:-}
    depends_on:
      - new-api
      - ollama

volumes:
  new-api-data:
    external: true
