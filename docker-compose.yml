# docker-compose.yml
version: '3.8'

services:
  fastapi:
    build: .
    ports:
      - "8000:8000"
    environment:
      - API_KEY
      - GLPI_TOKEN
      - OPENPROJECT_API_KEY

  glpi:
    image: glpi/glpi:latest
    ports:
      - "8088:80"
    environment:
      - GLPI_DB_HOST=mariadb
      - GLPI_DB_NAME=glpi
      - GLPI_DB_USER=glpi
      - GLPI_DB_PASSWORD=glpi

  openproject:
    image: openproject/openproject:latest
    ports:
      - "8090:80"
    environment:
      - OPENPROJECT_DB_HOST=mariadb
      - OPENPROJECT_DB_NAME=openproject
      - OPENPROJECT_DB_USER=openproject
      - OPENPROJECT_DB_PASSWORD=openproject

  mariadb:
    image: mariadb:latest
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=glpi
      - MYSQL_USER=glpi
      - MYSQL_PASSWORD=glpi
